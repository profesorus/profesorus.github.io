name: Build and Deploy to GitHub Pages (v4)

on:
  workflow_dispatch:
  # push:
  #   branches: [ master ]

permissions:
  contents: write  # Wymagane do pusha na gh-pages

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # cache: 'pnpm'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build (przykład dla np. Astro/Vite/Next.js)
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}  # Automatycznie dostępny
          publish_dir: ./dist  # Folder z plikami do deployu
          branch: gh-pages     # Docelowa gałąź
